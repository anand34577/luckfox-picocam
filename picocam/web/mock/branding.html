<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: #e6edf7; overflow: hidden;
    background: radial-gradient(1200px 600px at 85% 20%, #1b3a6b 0%, transparent 60%), radial-gradient(900px 500px at 0% 100%, #0f3d3a 0%, transparent 55%), #0b1220; }
  body.social { width: 1280px; height: 640px; }
  body.banner { width: 1600px; height: 480px; }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 72px; gap: 40px; }
  .left { flex: 0 0 auto; width: 560px; }
  .banner .left { width: 640px; }
  .logo { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
  .mark { width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(135deg, #38bdf8, #22d3ee 60%, #34d399); display: grid; place-items: center; box-shadow: 0 10px 30px rgba(56,189,248,.35); }
  .mark svg { width: 36px; height: 36px; }
  h1 { font-size: 76px; letter-spacing: -2px; line-height: 1; font-weight: 800; }
  .banner h1 { font-size: 84px; }
  .tag { font-size: 30px; line-height: 1.3; color: #b8c7dd; margin: 10px 0 26px; font-weight: 500; }
  .banner .tag { font-size: 30px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { padding: 8px 16px; border-radius: 999px; font-size: 20px; font-weight: 600; background: rgba(148,163,184,.14); border: 1px solid rgba(148,163,184,.25); color: #dbe7f7; }
  .chip.a { background: rgba(56,189,248,.16); border-color: rgba(56,189,248,.5); color: #7dd3fc; }
  .right { flex: 1; position: relative; height: 100%; }
  .frame { position: absolute; left: 0; top: 50%; width: 760px; transform: translateY(-50%) perspective(1800px) rotateY(-9deg) rotateX(2deg); border-radius: 16px; overflow: hidden; border: 1px solid #2a3a55; box-shadow: 0 40px 90px rgba(0,0,0,.6); background: #0b1220; }
  .banner .frame { width: 720px; }
  .bar { height: 30px; background: #141c2e; display: flex; gap: 8px; align-items: center; padding: 0 12px; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: #3b4a66; }
  .frame img { display: block; width: 100%; }
  .foot { position: absolute; left: 72px; bottom: 30px; font-size: 20px; color: #7f93b3; }
</style></head>
<body class="%%LAYOUT%%">
  <div class="wrap">
    <div class="left">
      <div class="logo"><div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#06202e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg></div><h1>PicoCam</h1></div>
      <div class="tag">Open-source IP camera firmware for the Luckfox&nbsp;Pico family</div>
      <div class="chips"><span class="chip a">RV1103 · RV1106</span><span class="chip">Web portal</span><span class="chip">RTSP · ONVIF</span><span class="chip">NPU AI</span><span class="chip">SPI NAND ready</span></div>
    </div>
    <div class="right"><div class="frame"><div class="bar"><i></i><i></i><i></i></div><img src="%%SHOT%%"></div></div>
  </div>
  <div class="foot">github.com/anand34577/luckfox-picocam</div>
</body></html>
