name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Install scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Shell syntax (POSIX sh for the board, bash for the PC)
        run: |
          for f in picocam/board/*.sh picocam/board/picocam.init; do sh -n "$f"; done
          for f in picocam/tools/*.sh picocam/build.sh; do bash -n "$f"; done
      - name: Version is consistent (VERSION, package.json, CHANGELOG)
        run: bash .github/scripts/check-version.sh
      - name: Installer, simulated (busybox, fake board)
        run: bash picocam/tests/simulate-install.sh
      - name: Deploy script end to end (fake ssh, fake board)
        run: bash picocam/tests/simulate-deploy.sh

  dashboard:
    name: EdgeAI dashboard and server (optional parts)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
      - run: go vet ./... && go build -o /dev/null ./... && go test ./...
        working-directory: server

  build:
    name: Firmware, web UI, package
    uses: ./.github/workflows/build.yml
