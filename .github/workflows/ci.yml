name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: picocam/web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: picocam/web
      - run: npx tsc --noEmit
        working-directory: picocam/web
      - run: npm run build
        working-directory: picocam/web
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax (POSIX sh for the board, bash for the PC)
        run: |
          for f in picocam/board/*.sh picocam/board/picocam.init; do sh -n "$f"; done
          for f in picocam/tools/*.sh picocam/build.sh; do bash -n "$f"; done
