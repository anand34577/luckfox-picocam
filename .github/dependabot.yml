version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
  - package-ecosystem: npm
    directory: /picocam/web
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']   # majors need a deliberate migration, not an automatic PR
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']   # majors need a deliberate migration, not an automatic PR
  - package-ecosystem: gomod
    directory: /server
    schedule: {interval: monthly}
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
